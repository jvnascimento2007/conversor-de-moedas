<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmbio Certo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Conversor</h1>
        <input type="number" id="valor" placeholder="Valor">
        <select id="moeda">
            <option value="USD-BRL">Dólar (USD -> BRL)</option>
            <option value="EUR-BRL">Euro (EUR -> BRL)</option>
            <option value="JPY-BRL">Iene (JPY -> BRL)</option>
        </select>
        <button onclick="converter()">Converter</button>
        <p id="resultado">R$ 0,00</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
